server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: procurement-engine
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/procurement_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  engine:
    revalidation:
      max-retry-attempts: 3
    ranking:
      weights:
        tco: 0.30
        price: 0.20
        reliability: 0.15
        delivery: 0.10
        warranty: 0.10
        return-policy: 0.05
        seller-rating: 0.05
        soft-preferences: 0.05

logging:
  level:
    root: INFO
    com.procurement.engine: DEBUG
    org.hibernate.SQL: INFO
