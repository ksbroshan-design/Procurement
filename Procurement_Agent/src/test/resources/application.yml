spring:
  application:
    name: procurement-engine-test
  datasource:
    url: jdbc:h2:mem:procurement_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
  engine:
    revalidation:
      max-retry-attempts: 3
    ranking:
      weights:
        tco: 0.30
        price: 0.20
        reliability: 0.15
        delivery: 0.10
        warranty: 0.10
        return-policy: 0.05
        seller-rating: 0.05
        soft-preferences: 0.05

logging:
  level:
    root: WARN
    com.procurement.engine: INFO
    org.hibernate.SQL: INFO
    org.hibernate.tool.schema: DEBUG
