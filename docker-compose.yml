services:
  postgres:
    image: postgres:16-alpine
    container_name: procurement-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-procurement_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-procurement_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Procurement_Agent
      dockerfile: Dockerfile
    container_name: procurement-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-procurement_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      PORT: 8080
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./autonomous-procurement
      dockerfile: Dockerfile
    container_name: procurement-ai-service
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      SPRING_BASE_URL: http://backend:8080
      PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
